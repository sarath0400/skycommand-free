# ============================================================================
# Azure DevOps pipeline — EXACT skyCommand style.
#   Stage 1  Build  -> docker build + push to Azure Container Registry (ACR)
#   Stage 2  Dev     -> deploy container to Azure App Service (Dev)
#   Stage 3  QA      -> deploy to App Service (QA)   -- approval on 'qa' env
#   Stage 4  Prod    -> deploy to App Service (Prod) -- approval on 'prod' env
#
# Two service connections (same split as real skyCommand):
#   acr-connection    = Docker Registry service connection -> your ACR
#   azure-connection  = Azure Resource Manager service connection -> your subscription
#
# Variable group 'skycommand-exact' (Pipelines > Library) must define:
#   acrName          e.g. skycmdfreeacr            (ACR name, no .azurecr.io)
#   imageName        e.g. skycommand-free
#   appServiceDev    e.g. skycmd-free-dev
#   appServiceQA     e.g. skycmd-free-qa
#   appServiceProd   e.g. skycmd-free-prod
#   kvName           e.g. skycmd-free-kv           (Key Vault name)
# ============================================================================

trigger:
  branches:
    include: [ release ]

variables:
  - group: skycommand-exact
  - name: tag
    value: '$(Build.BuildId)'

stages:
# --- Stage 1: Build & push to ACR --------------------------------------------
- stage: Build
  displayName: 'Build and Push to ACR'
  jobs:
  - job: BuildImage
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Build and push image to ACR'
      inputs:
        containerRegistry: 'acr-connection'
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(tag)
          latest

# --- Stage 2: Deploy to Dev (automatic) --------------------------------------
- stage: DeployDev
  displayName: 'Deploy to Dev'
  dependsOn: Build
  jobs:
  - deployment: Dev
    environment: 'dev'
    pool: { vmImage: 'ubuntu-latest' }
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy container to Dev App Service'
            inputs:
              azureSubscription: 'azure-connection'
              appName: '$(appServiceDev)'
              containers: '$(acrName).azurecr.io/$(imageName):$(tag)'
              appSettings: >-
                -WEBSITES_PORT 5000
                -MIGRATE_ON_BOOT true
                -DATABASE_URL "@Microsoft.KeyVault(SecretUri=https://$(kvName).vault.azure.net/secrets/DATABASE-URL/)"
                -GEMINI_API_KEY "@Microsoft.KeyVault(SecretUri=https://$(kvName).vault.azure.net/secrets/GEMINI-API-KEY/)"

# --- Stage 3: Deploy to QA (approval on 'qa' environment) --------------------
- stage: DeployQA
  displayName: 'Deploy to QA'
  dependsOn: DeployDev
  jobs:
  - deployment: QA
    environment: 'qa'
    pool: { vmImage: 'ubuntu-latest' }
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy container to QA App Service'
            inputs:
              azureSubscription: 'azure-connection'
              appName: '$(appServiceQA)'
              containers: '$(acrName).azurecr.io/$(imageName):$(tag)'
              appSettings: >-
                -WEBSITES_PORT 5000
                -MIGRATE_ON_BOOT true
                -DATABASE_URL "@Microsoft.KeyVault(SecretUri=https://$(kvName).vault.azure.net/secrets/DATABASE-URL/)"
                -GEMINI_API_KEY "@Microsoft.KeyVault(SecretUri=https://$(kvName).vault.azure.net/secrets/GEMINI-API-KEY/)"

# --- Stage 4: Deploy to Production (approval on 'prod' environment) -----------
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployQA
  jobs:
  - deployment: Prod
    environment: 'prod'
    pool: { vmImage: 'ubuntu-latest' }
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy container to Prod App Service'
            inputs:
              azureSubscription: 'azure-connection'
              appName: '$(appServiceProd)'
              containers: '$(acrName).azurecr.io/$(imageName):$(tag)'
              appSettings: >-
                -WEBSITES_PORT 5000
                -MIGRATE_ON_BOOT true
                -DATABASE_URL "@Microsoft.KeyVault(SecretUri=https://$(kvName).vault.azure.net/secrets/DATABASE-URL/)"
                -GEMINI_API_KEY "@Microsoft.KeyVault(SecretUri=https://$(kvName).vault.azure.net/secrets/GEMINI-API-KEY/)"
